<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700;800;900&display=swap');

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    /* ✅ تعديلات Electron للسحب والشفافية */
    html, body {
        background: transparent !important;
        overflow: hidden;
        width: 100%;
        height: 100%;
    }

    body {
        /* جعل كامل النافذة قابلة للسحب */
        -webkit-app-region: drag;
        user-select: none;
        /* إزالة توسيط الصفحة الأصلية - الحاوية الآن في الزاوية */
        display: block;
        min-height: auto;
    }

    /* زر الخروج (إن أضفته) يجب ألا يكون قابلاً للسحب */
    button, input, a {
        -webkit-app-region: no-drag;
    }

    .container {
        position: relative;
        background: #000;
        min-height: 100px;
        border-radius: 20px;
        border-top-left-radius: 255px;
        border-top-right-radius: 255px;
        box-shadow: 5px 25px 75px rgba(225, 255, 255)
                    10px 10px 70px rgba(223, 138, 211, 0.25),
                    inset 5px 5px 10px rgba(233, 188, 188, 0.5),
                    inset 5px 5px 20px rgba(52, 206, 211, 0.2),
                    inset 5px 5px 15px rgba(141, 227, 233, 0.75);
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 10px; 
        padding-bottom: 10px;
        /* توسيط الحاوية داخل النافذة */
        margin: 75px auto 40px auto;
        width: fit-content;
    }

    .clock {
        position: relative;
        width: 150px;
        height: 150px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 10px 50px 70px rgba(14, 13, 13, 0.25),
                    inset 5px 5px 10px rgba(0,0,0,0.5),
                    inset 5px 5px 20px rgba(255,255,255,0.2),
                    inset 5px 5px 15px rgba(0,0,0,0.75);
    }

    .clock::before {
        content: '';
        position: absolute;
        width: 4px;
        height: 4px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background: #fff;
        border: 2px solid #000;
        border-radius: 50%;
        z-index: 10000;
    }

    .clock span {
        position: absolute;
        inset: 5px;
        color: brown;
        border: 8px;
        border-color:#04fc43;
        text-align: center;
        transform: rotate(calc(30deg * var(--i)));
    }

    .clock span b {
        font-size: 0.75em; 
        opacity: 0.95; 
        font-weight: bold;
        display: inline-block;
        transform: rotate(calc(-30deg * var(--i)));
    }

    #Day {
        position: absolute;
        left: 98px;
        top:68px;
        font-size: 10px;
        font-weight:600;
        background: rgb(152, 236, 236);
        color:rgb(179, 62, 62); 
        border-radius: 15px; 
        width: 28px;
        align-items: 3px;
        text-align: center;     
    }

    .circle {
        position: absolute;
        width: 110px;
        height: 110px;
        border: 4px solid rgba(255,255,255,0);
        border-radius: 50%;
        left: 21px;
        top: 20px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        z-index: 10;
    }

    .circle i {
        position: absolute;
        width: 5px;   
        height: 50%;
        background: var(--clr);
        opacity: 0.95;
        transform-origin: bottom;
        transform: scaleY(0.85);
    }

    .circle:nth-child(1) i { width: 1.5px; }
    .circle:nth-child(2) i { width: 3px; }

    .circle2 { width: 95px; height: 95px; left: 28px; top: 28px; z-index: 9; }
    .circle3 { width: 80px; height: 80px; left: 36px; top: 35px; z-index: 8; }

    .circle::before {
        content: '';
        position: absolute;
        top: -4.5px; 
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--clr);
        box-shadow: 0 0 20px var(--clr), 0 0 60px var(--clr);
    }

    #time {
        display: flex;
        padding: 6px 12px;
        font-size: 0.9em;
        font-weight: 600;
        border: 2px solid rgba(231, 228, 13, 0.5);
        border-radius: 40px;
        box-shadow: 5px 5px 10px rgba(240, 184, 184, 0.5),
                    inset 5px 5px 20px rgba(238, 233, 233, 0.2),
                    inset -5px -5px 15px rgba(0,0,0,0.75);
    }

    #time div {
        position: relative;
        width: 30px;
        text-align: center;
        font-weight: 600;
        color: var(--clr);
    }

    #hours::after, #minutes::after {
        content: ':';
        position: absolute;
        right: -4px;
        color: #fff;
    }

    #minutes::after {
        animation: animate 1s steps(1) infinite;
    }

    #time div:last-child {
        font-size: 0.75em;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #070707;
        width: 8px;
        padding-left: 8px;
    }

    @keyframes animate {
        0% { opacity: 1; }
        50% { opacity: 0; }
    }
</style>

</head>
<body>
    <div class="container">
        <div class="clock">

            <div class="circle" id="sc" style="--clr:#367ef1;"><i></i></div>
            <div class="circle circle2" id="mn" style="--clr:#23c40e;"><i></i></div>
            <div class="circle circle3" id="hr" style="--clr:#caae0b;"><i></i></div>

            <span style="--i:1;"><b>1</b></span>
            <span style="--i:2;"><b>2</b></span>
            <span style="--i:3;"><b>3</b></span>
            <span style="--i:4;"><b>4</b></span>
            <span style="--i:5;"><b>5</b></span>
            <span style="--i:6;"><b>6</b></span>
            <span style="--i:7;"><b>7</b></span>
            <span style="--i:8;"><b>8</b></span>
            <span style="--i:9;"><b>9</b></span>
            <span style="--i:10;"><b>10</b></span>
            <span style="--i:11;"><b>11</b></span>
            <span style="--i:12;"><b>12</b></span>
            <div id="Day"></div>

        </div>

        <div id="time">
            <div id="hours" style="--clr:#caae0b;">00</div>
            <div id="minutes" style="--clr:#23c40e;">00</div>
            <div id="seconds" style="--clr:#719ee7;">00</div>
            <div id="ampm">AM</div>
        </div>
    </div>

<script>
    // ============================================
    // 🔔 Classic Bell Chime System
    // ============================================
    let audioCtx = null;
    let lastChimeHour = -1;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playDong(baseFrequency = 261.63, volume = 0.35) {
        initAudio();
        const now = audioCtx.currentTime;

        const masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(volume, now);
        masterGain.connect(audioCtx.destination);

        const partials = [
            { freqRatio: 0.5,  decay: 3.2, amp: 0.55, type: 'sine' },
            { freqRatio: 1.0,  decay: 2.8, amp: 0.75, type: 'sine' },
            { freqRatio: 1.19, decay: 2.4, amp: 0.40, type: 'sine' },
            { freqRatio: 1.51, decay: 2.0, amp: 0.35, type: 'sine' },
            { freqRatio: 2.01, decay: 1.7, amp: 0.40, type: 'sine' },
            { freqRatio: 2.52, decay: 1.3, amp: 0.20, type: 'sine' },
            { freqRatio: 3.00, decay: 1.0, amp: 0.15, type: 'triangle' },
            { freqRatio: 4.02, decay: 0.7, amp: 0.10, type: 'sine' },
        ];

        partials.forEach(p => {
            const osc = audioCtx.createOscillator();
            const env = audioCtx.createGain();

            osc.type = p.type;
            osc.frequency.setValueAtTime(baseFrequency * p.freqRatio, now);

            env.gain.setValueAtTime(0.0001, now);
            env.gain.exponentialRampToValueAtTime(p.amp, now + 0.003);
            env.gain.exponentialRampToValueAtTime(0.0001, now + p.decay);

            osc.connect(env);
            env.connect(masterGain);
            osc.start(now);
            osc.stop(now + p.decay + 0.1);
        });

        const strikeOsc = audioCtx.createOscillator();
        const strikeGain = audioCtx.createGain();
        const strikeFilter = audioCtx.createBiquadFilter();
        
        strikeOsc.type = 'square';
        strikeOsc.frequency.setValueAtTime(baseFrequency * 8, now);
        strikeFilter.type = 'bandpass';
        strikeFilter.frequency.setValueAtTime(baseFrequency * 6, now);
        strikeFilter.Q.setValueAtTime(10, now);
        
        strikeGain.gain.setValueAtTime(0.2, now);
        strikeGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
        
        strikeOsc.connect(strikeFilter);
        strikeFilter.connect(strikeGain);
        strikeGain.connect(masterGain);
        strikeOsc.start(now);
        strikeOsc.stop(now + 0.1);
    }

    function chimeHour(hour24) {
        let h12 = hour24 % 12;
        if (h12 === 0) h12 = 12;

        const intervalMs = 2500;
        for (let i = 0; i < h12; i++) {
            setTimeout(() => {
                playDong(261.63);
            }, i * intervalMs);
        }
    }
    // ============================================

    let hr = document.querySelector('#hr');
    let mn = document.querySelector('#mn');
    let sc = document.querySelector('#sc');

    function update() { 
        let day = new Date();
        let hh = day.getHours() * 30;
        let mm = day.getMinutes() * 6;
        let ss = day.getSeconds() * 6;

        hr.style.transform = `rotateZ(${hh + (mm / 12)}deg)`;
        mn.style.transform = `rotateZ(${mm}deg)`;
        sc.style.transform = `rotateZ(${ss}deg)`;
      
        let Day = document.getElementById('Day');
        let hours = document.getElementById('hours');
        let minutes = document.getElementById('minutes');
        let seconds = document.getElementById('seconds');
        let ampm = document.getElementById('ampm');

        let h = day.getHours();
        let m = day.getMinutes();
        let s = day.getSeconds();
        let D = day.toLocaleDateString('en-EG', {day: 'numeric', month: 'numeric'});

        let am = h >= 12 ? 'PM' : 'AM';

        if (h > 12) {
            h = h - 12;
        }

        h = (h < 10) ? '0' + h : h;
        m = (m < 10) ? '0' + m : m;
        s = (s < 10) ? '0' + s : s;

        hours.innerHTML = h;
        minutes.innerHTML = m;
        seconds.innerHTML = s;
        ampm.innerHTML = am; 
        Day.innerHTML = D;

        // 🔔 رنين الجرس كل ساعة
        const currentHour = day.getHours();
        const currentMin = day.getMinutes();
        const currentSec = day.getSeconds();
        
        if (currentMin === 0 && currentSec === 0 && lastChimeHour !== currentHour) {
            lastChimeHour = currentHour;
            chimeHour(currentHour);
        }
    }

    setInterval(update, 1000);

    // استقبال إشارة اختبار الرنين من قائمة الزر الأيمن
    if (window.electronAPI) {
        window.electronAPI.onTestChime(() => {
            const currentHour = new Date().getHours();
            chimeHour(currentHour);
        });
    }
</script>

</body>
</html>
